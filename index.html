<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FC 더퍼스트</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FC더퍼스트">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 0%, #7f1d1d 0%, #1a0505 40%, #000 80%);
      color: #fff; font-family: -apple-system, "Segoe UI", sans-serif; transition: opacity .4s; }
    #splash img { width: 96px; height: auto; filter: drop-shadow(0 0 14px rgba(239,68,68,.4)); }
    #splash b { font-size: 22px; letter-spacing: .04em; }
    #splash small { color: #ef4444; letter-spacing: .35em; font-size: 10px; font-weight: 700; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f4f6;
      padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <b>FC 더퍼스트</b>
    <small>FOOTBALL CLUB</small>
  </div>
  <iframe id="app" title="FC 더퍼스트" allow="clipboard-write"></iframe>
  <script>
    // ★ 여기에 Apps Script 웹앱 주소(/exec로 끝나는 주소)를 넣으세요
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyGIQwgXA1Dnz11eHOn8uYPS0RAUspGAhyhsGvNR3q-tWx4ulg0I6Uh1jVUSjvTNI4u4A/exec';

    var f = document.getElementById('app');
    f.addEventListener('load', function () {
      setTimeout(function () {
        var s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(function () { s.style.display = 'none'; }, 450);
      }, 300);
    });
    f.src = EXEC_URL;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
    <script>
    // ===== 로그인 정보 보관 (사파리 자동 로그인용) =====
    // 앱 화면에서 오는 요청만 처리하고, 이 페이지(주소)의 저장소에 로그인 정보를 보관합니다.
    (function () {
      var KEY = 'fc_user_shell';
      window.addEventListener('message', function (e) {
        // 구글 앱 화면(googleusercontent.com)에서 온 메시지만 허용
        if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
        var d = e.data || {};
        try {
          if (d.fcType === 'get') {
            var v = null;
            try { v = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (x) {}
            e.source.postMessage({ fcType: 'user', user: v }, e.origin);
          } else if (d.fcType === 'save' && d.user && d.user.token) {
            localStorage.setItem(KEY, JSON.stringify(d.user));
          } else if (d.fcType === 'clear') {
            localStorage.removeItem(KEY);
          }
        } catch (x) {}
      });
    })();
  </script>

</body>
</html>
